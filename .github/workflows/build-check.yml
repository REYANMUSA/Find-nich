name: Build check

on:
  push:
    branches:
      - launch/supabase-vercel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build storefront
        run: npm run build
